name: build-frida-arm64
# Workflow ringkas: build frida-server arm64 yg sudah di-patch Florida,
# lalu upload sebagai ARTIFACT (tanpa bikin release -> tak perlu izin tulis).
# Taruh file ini sbg .github/workflows/build-arm64.yml di repo mirror Florida Anda.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib \
            flex bison ruby ruby-dev python3-requests python3-setuptools \
            python3-dev python3-pip libc6-dev libc6-dev-i386
          python3 -m pip install lief

      - name: Build frida-server (arm64) with Florida patches
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          git config --global user.name "lab"
          git config --global user.email "lab@example.com"

          # PENTING: pin ke tag RILIS frida (bukan main-dev) biar patch Florida cocok
          FRIDA_TAG=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "FRIDA_TAG=$FRIDA_TAG"
          echo "FRIDA_TAG=$FRIDA_TAG" >> "$GITHUB_ENV"

          git clone https://github.com/frida/frida
          cd frida
          git checkout "$FRIDA_TAG"
          git submodule update --init --recursive

          # apply TOLERAN: git apply --reject (hunk yg cocok masuk, yg tak cocok
          # di-skip jadi .rej) -> build tetap lanjut walau 1-2 patch drift.
          for path in ../patches/*; do
            name=$(basename "$path")
            [ -d "subprojects/$name" ] || continue
            echo "== apply patches -> subprojects/$name =="
            for p in "$path"/*.patch; do
              abs=$(realpath "$p")
              echo "   -> $(basename "$p")"
              ( cd "subprojects/$name" && git apply --reject --whitespace=nowarn "$abs" ) \
                && echo "      OK" || echo "      [!] sebagian/skip (lihat .rej)"
            done
          done
          echo "== .rej files (hunk yg gagal) =="
          find subprojects -name '*.rej' -print || true
          cd ..
          mkdir build-arm64 && cd build-arm64
          ../frida/configure --host=android-arm64
          make
          echo "== versi ter-build =="
          cat ../frida/RELEASE 2>/dev/null || true

      - name: Show result path
        run: ls -la build-arm64/subprojects/frida-core/server/ || true

      - name: Upload frida-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-${{ env.FRIDA_TAG }}-arm64
          path: build-arm64/subprojects/frida-core/server/frida-server
          if-no-files-found: error
